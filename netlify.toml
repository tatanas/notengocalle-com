# Netlify construye y publica desde GitHub: cada push a la rama de producción despliega el sitio,
# y cada rama o pull request recibe su propia vista previa.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Los archivos de /assets llevan un hash en el nombre: se pueden guardar para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El service worker debe revisarse en cada visita para que las actualizaciones lleguen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
