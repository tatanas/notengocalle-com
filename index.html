<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NoTengoCalle</title>
<meta name="description" content="Juego para aprender comunas, calles, landmarks y metro de Santiago.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoTengoCalle">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="/src/estilos/estilos.css">
<!-- Google AdSense (async: no frena la carga del juego). Qué anuncios salen y dónde se decide en la cuenta de AdSense. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4475367095699323" crossorigin="anonymous"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <nav id="pestanas" aria-label="Secciones">
      <button id="btnHome" class="pestana pestana-inicio activa" data-pantalla="home" title="Juegos" aria-current="page"><img src="/icons/icon-192.png" alt="" width="20" height="20"><span class="marca">NoTengoCalle</span></button>
      <button id="btnRanking" class="pestana" data-pantalla="ranking" title="Ranking" aria-label="Ranking"><span class="icono">🏆</span><span class="texto">Ranking</span></button>
      <button id="btnExplorar" class="pestana" data-pantalla="explore" title="Explorar el mapa" aria-label="Explorar el mapa"><span class="icono">🔎</span><span class="texto">Explorar</span></button>
      <button id="btnProgreso" class="pestana" data-pantalla="progress" title="Mi progreso" aria-label="Mi progreso"><span class="icono">📊</span><span class="texto">Mi progreso</span></button>
    </nav>
    <div id="hud"></div>
    <button id="btnRestart" class="iconbtn" title="Reiniciar la ronda" aria-label="Reiniciar la ronda" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btnAccount" class="accountbtn" hidden>Entrar</button>
  </header>
  <div id="map"></div>
  <section id="panel" class="hidden"></section>
  <main id="screen" class="screen"></main>
</div>
<div id="countdown" hidden></div>
<dialog id="accountDialog"></dialog>
<dialog id="confirmDialog"></dialog>
<!-- Librerías del mapa y datos del juego: archivos estáticos de public/, fuera del bundle. -->
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/maplibre/maplibre-gl.js"></script>
<script src="/vendor/maplibre/leaflet-maplibre-gl.js"></script>
<script src="/data/data.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
